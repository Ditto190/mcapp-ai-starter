name: Renovate

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * 1-5'   # 04:00 UTC Mon–Fri

permissions:
  contents: write
  pull-requests: write
  issues: write
  checks: write
  statuses: write
  packages: write
  repository-projects: write
  security-events: write
  actions: write

jobs:
  renovate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Run Renovate
        uses: renovatebot/github-action@v40.0.0
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          LOG_LEVEL: info
