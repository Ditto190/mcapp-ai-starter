name: GenerateAgents Factory
version: 1.0.0
description: |
  Meta-agent framework for generating specialized Copilot agents.
  Enables self-improving agent ecosystems through code analysis and composition.
  Contains the GenerateAgents base agent plus generated specialized agents.

author:
  name: DT
  github: Ditto190
  email: nomail@gmail.com

contact:
  issues: "https://github.com/originalankur/GenerateAgents.md/issues"
  discussions: "https://github.com/originalankur/GenerateAgents.md/discussions"

tags:
  - agent-generation
  - meta-programming
  - code-analysis
  - composable
  - self-improving
  - n8n
  - github-models
  - copilot

repository: "https://github.com/originalankur/GenerateAgents.md"
license: MIT

# Base agent that other agents inherit from
agents:
  # ========================================
  # TIER 1: Factory Agent (Base)
  # ========================================

  - id: generateagents-factory
    name: GenerateAgents Factory Agent
    shortName: Factory
    version: 1.0.0
    tier: factory
    description: |
      Core meta-agent that generates specialized Copilot agents from repository analysis.
      This is the factory—all other agents in this collection are generated by this agent
      or by agents generated by this agent.

    baseCapabilities:
      - analyzeCodebase: Extract patterns, conventions, and architecture from code
      - generateAgentDefinition: Create AGENTS.md documentation for new agents
      - createToolSchemas: Generate JSON schemas for agent tools
      - registerAgent: Auto-register generated agents in collection

    tools:
      - generateAgent: Create new specialized agent
      - analyzeCodebase: Analyze repository structure and patterns
      - validateAgent: Verify agent configuration

    models:
      preferred: gpt-4o
      alternatives:
        - gpt-4o-mini
        - claude-3-5-sonnet

    capabilities:
      - Can generate other agents (recursive)
      - Can analyze arbitrary codebases
      - Can validate generated configurations
      - Can auto-register agents in awesome-copilot

    constraints:
      - Daily rate limits depend on model choice
      - gpt-4o: 50 generations/day
      - gpt-4o-mini: 150 generations/day
      - claude-3-5-sonnet: 50 generations/day

    performance:
      avgTimePerAnalysis: "2-5 minutes"
      avgTokensPerAnalysis: "4000-8000"
      successRate: "95%"

    integrations:
      - n8n: Orchestrates workflow execution
      - GitHub: Clones and analyzes repositories
      - GitHub Models API: Uses free AI models (Pro required)
      - awesome-copilot: Auto-registers generated agents

    metadata:
      isFactory: true
      supportsRecursion: true
      canGenerateOtherAgents: true
      integrationPath: "./agents/generateagents_base.py"
      instructionsPath: "./.github/copilot-instructions.md"
      toolDefinitionsPath: "./mcp-tools/"

    examples:
      - title: "Generate Web Agent"
        description: "Create agent for web scraping and analysis"
        command: |
          generateAgent({
            repositoryUrl: "https://github.com/example/web-scraper",
            codebaseContext: "Python web scraping framework",
            agentPurpose: "web-agent",
            modelChoice: "gpt-4o"
          })
        expectedOutput: "WebScraperAgent with specialized web scraping tools"
        timeToComplete: "2-3 minutes"

      - title: "Generate Data Agent"
        description: "Create agent for data transformations and ETL"
        command: |
          generateAgent({
            repositoryUrl: "https://github.com/example/data-pipeline",
            codebaseContext: "Apache Airflow data pipelines",
            agentPurpose: "data-agent",
            modelChoice: "gpt-4o"
          })
        expectedOutput: "DataPipelineAgent with ETL and transformation tools"
        timeToComplete: "3-4 minutes"

      - title: "Recursive Generation"
        description: "Generate agents that improve other agents"
        command: |
          // First generation
          generateAgent({
            agentPurpose: "api-agent",
            repositoryUrl: "github.com/example/rest-api"
          })

          // Second generation (using first agent)
          apiAgent.use(generateAgent({
            agentPurpose: "custom",
            customPurpose: "Add GraphQL support to REST API testing"
          }))
        expectedOutput: "API Agent extended with GraphQL capabilities"
        timeToComplete: "4-6 minutes total"

# ========================================
# TIER 2: Specialized Generated Agents
# ========================================

generatedAgents:
  - id: web-agent-template
    name: Web Agent Template
    description: |
      Template for web-focused agents (scraping, crawling, analysis).
      Generated agents from web-related repositories will inherit this template.
    capabilities:
      - Web scraping with Selenium/BeautifulSoup
      - HTML parsing and DOM manipulation
      - Website analysis and extraction
      - Browser automation
    toolsInjected:
      - webScraper
      - htmlParser
      - browserAutomation

  - id: api-agent-template
    name: API Agent Template
    description: |
      Template for API-focused agents (REST, GraphQL, SDK testing).
      Generated agents from API repositories will inherit this template.
    capabilities:
      - REST API testing and validation
      - GraphQL query building and testing
      - API documentation generation
      - Authentication and authorization testing
    toolsInjected:
      - httpClient
      - graphqlValidator
      - apiDocGenerator
      - authTester

  - id: data-agent-template
    name: Data Agent Template
    description: |
      Template for data-focused agents (ETL, transformation, analysis).
      Generated agents from data pipeline repositories will inherit this template.
    capabilities:
      - Data pipeline orchestration
      - Schema validation and transformation
      - Data quality checks
      - ETL workflow management
    toolsInjected:
      - pipelineOrchestrator
      - schemaValidator
      - dataQualityChecker
      - etlWorkflow

# ========================================
# TOOLS: Available to all agents
# ========================================

tools:
  # Core Factory Tools
  generateAgent:
    id: generateAgent
    name: Generate Agent
    version: 1.0.0
    description: "Generate a new specialized Copilot agent from repository analysis"
    category: agent-generation
    toolDefinitionFile: "./mcp-tools/generateagents.tool.json"
    backend: "n8n-workflow"
    availableInAgents: ["*"] # All agents have access

  analyzeCodebase:
    id: analyzeCodebase
    name: Analyze Codebase
    version: 1.0.0
    description: "Extract patterns, conventions, and architecture from code"
    category: code-analysis
    toolDefinitionFile: "./mcp-tools/analyzecodebase.tool.json"
    backend: "n8n-workflow"
    availableInAgents: ["*"]

  validateAgent:
    id: validateAgent
    name: Validate Agent Configuration
    version: 1.0.0
    description: "Validate generated AGENTS.md and tool schemas"
    category: validation
    toolDefinitionFile: "./mcp-tools/validateagent.tool.json"
    backend: "n8n-workflow"
    availableInAgents: ["*"]

# ========================================
# COMPOSITION PATTERNS
# ========================================

patterns:
  - name: "Simple Generation"
    description: "Generate a single specialized agent"
    steps:
      - "User provides repository URL and desired purpose"
      - "GenerateAgents analyzes codebase"
      - "Generates AGENTS.md and tool schemas"
      - "Agent becomes immediately available"
    timeToComplete: "2-5 minutes"
    rateLimit: "1 per hour recommended"

  - name: "Recursive Improvement"
    description: "Generated agents improve themselves"
    steps:
      - "Initial agent generated with basic capabilities"
      - "Request: improve agent with feature X"
      - "Agent calls generateAgent on enhanced spec"
      - "New version created with inherited + new capabilities"
      - "Bidirectional seamless improvement"
    timeToComplete: "4-10 minutes per iteration"
    rateLimit: "5-10 improvements/day recommended"

  - name: "Specialization Chain"
    description: "Build chain of increasingly specialized agents"
    steps:
      - "Round 1: Generate base DataAgent"
      - "Round 2: DataAgent generates DataCleaningAgent (specialization)"
      - "Round 3: DataCleaningAgent generates ValidationAgent"
      - "Round 4: ValidationAgent generates AlertingAgent"
    timeToComplete: "10-20 minutes for 4-agent chain"
    rateLimit: "1-2 chains/day recommended"
    benefits:
      - Each agent inherits parent capabilities
      - Highly specialized by end of chain
      - Modular and composable
      - Clear inheritance hierarchy

  - name: "Team Generation"
    description: "Generate complete tool suite for specific domain"
    exampleSuite: "DataPlatform"
    steps:
      - "Generate DataIngestionAgent"
      - "Generate DataTransformationAgent"
      - "Generate DataStorageAgent"
      - "Generate DataQueryAgent"
      - "Generate MonitoringAgent"
      - "All registered in collection as team"
    timeToComplete: "15-30 minutes"
    benefits:
      - Complete domain coverage
      - Agents can call each other
      - Coordinated toolset
      - Maintainable architecture

# ========================================
# USAGE WORKFLOW (Step-by-Step)
# ========================================

usageWorkflow:
  - step: 1
    title: "Discovery"
    description: |
      Copilot discovers this collection in awesome-copilot
      Collection contains GenerateAgents factory and tool definitions
    action: "Copilot loads collection.yml"

  - step: 2
    title: "User Request"
    description: |
      User asks Copilot: "Create an agent for X"
      Could be: web scraping, API testing, data pipelines, etc.
    action: "Copilot recognizes request type"

  - step: 3
    title: "Tool Invocation"
    description: |
      Copilot calls generateAgent tool with:
      - Repository URL or description
      - Desired agent purpose
      - Model choice (gpt-4o recommended)
    action: "`generateAgent()` tool executes"

  - step: 4
    title: "Workflow Execution"
    description: |
      n8n GenerateAgents workflow runs:
      - Clones and analyzes repository
      - Extracts conventions, patterns, architecture
      - Uses GitHub Models API to generate documentation
      - Creates AGENTS.md and tool schemas
    action: "n8n executes 10-15 node workflow"
    duration: "2-5 minutes"

  - step: 5
    title: "Artifact Generation"
    description: |
      Workflow produces:
      - Complete AGENTS.md documentation
      - Tool definitions (JSON schemas)
      - Integration instructions
      - Copilot manifest
    action: "Workflow outputs structured data"

  - step: 6
    title: "Auto-Registration"
    description: |
      Generated agent pieces auto-register:
      - Saved to agents/generated/ folder
      - Tool schemas saved to mcp-tools/
      - Collection.yml updated with new agent entry
      - awesome-copilot discovers new agent
    action: "n8n auto-registration nodes execute"

  - step: 7
    title: "Immediate Availability"
    description: |
      New agent becomes immediately available:
      - Copilot can discover it
      - Other agents can see and reference it
      - Can be composed into larger systems
      - New agent also has generateAgent tool (recursive)
    action: "Agent ready for use"

  - step: 8
    title: "Optional: Extend Agent"
    description: |
      User asks: "Agent B, extend yourself with feature X"
      Agent B calls generateAgent on itself
      Creates Agent C (enhanced version of Agent B)
    action: "Recursive generation enables self-improvement"

# ========================================
# BEST PRACTICES
# ========================================

bestPractices:
  - title: "Model Selection"
    recommendations:
      - "Production agents: Use gpt-4o (best quality, 50/day)"
      - "Quick iterations: Use gpt-4o-mini (150/day)"
      - "Complex specs: Use claude-3-5-sonnet (best prompt following)"

  - title: "Repository Selection"
    recommendations:
      - "Choose repos with clear patterns and conventions"
      - "Prefer well-documented code"
      - "Include tests for better pattern extraction"
      - "Avoid very large repos (>1GB); analyze subfolders instead"

  - title: "Composition Strategy"
    recommendations:
      - "Start simple: Generate one agent at a time"
      - "Validate before extending: Use validateAgent tool"
      - "Track lineage: Note which agent generated which"
      - "Document intentions: Record why each agent was created"

  - title: "Rate Limiting"
    recommendations:
      - "gpt-4o (50/day): 7-10 practical generations per day"
      - "gpt-4o-mini (150/day): 20-30 practical per day"
      - "Space out large batch operations"
      - "Monitor GitHub Models API dashboard for usage"

# ========================================
# INTEGRATION POINTS
# ========================================

integrations:
  github:
    description: "Repository analysis and credential access"
    requirements:
      - GITHUB_PERSONAL_ACCESS_TOKEN in .env
      - Repo visibility (public or private with access)
    capabilities:
      - Clone repositories
      - Read file structure
      - Analyze commit history (optional)

  github-models:
    description: "Free AI models for analysis"
    requirements:
      - GitHub Pro account
      - API authentication
    models:
      - gpt-4o
      - gpt-4o-mini
      - claude-3-5-sonnet

  n8n:
    description: "Workflow execution engine"
    requirements:
      - n8n server running
      - N8N_API_URL and N8N_API_KEY in .env
    workflows:
      - GenerateAgents
      - AnalyzeCodebase
      - ValidateAgent

  awesome-copilot:
    description: "Agent discovery and composition"
    requirements:
      - Collection registered in Knowledge/collections/
      - Tools referenced in collection manifests

# ========================================
# QUICK START EXAMPLES
# ========================================

quickStart:
  example1:
    title: "Generate Web Scraper Agent"
    description: "Create an agent specialized in web scraping"
    steps:
      - 'User: "Create an agent for web scraping Ecommerce sites"'
      - 'Copilot: "I have the generateAgent tool. Let me use it."'
      - |
        Copilot calls:
        generateAgent({
          repositoryUrl: "https://github.com/scrapy/scrapy",
          codebaseContext: "Scrapy web scraping framework",
          agentPurpose: "web-agent",
          modelChoice: "gpt-4o"
        })
      - "n8n analyzes Scrapy repository (2-3 min)"
      - "Result: WebScraperAgent with specialized tools"
      - 'Copilot: "Created WebScraperAgent. Ready to scrape!"'
    totalTime: "2-3 minutes"
    result: "Web scraper agent immediately available"

  example2:
    title: "Recursive Agent Enhancement"
    description: "Self-improving agent via recursive generation"
    steps:
      - "Copilot Agent A (API Tester) exists"
      - 'User: "Agent A, add GraphQL support to yourself"'
      - 'Agent A: "I have generateAgent tool. Extending myself..."'
      - |
        Agent A calls:
        generateAgent({
          repositoryUrl: "internal-enhanced-spec",
          codebaseContext: "REST testing + GraphQL support",
          agentPurpose: "api-agent",
          customPurpose: "Self-improvement"
        })
      - "Agent B created (A + GraphQL)"
      - 'User: "Agent B, add caching to yourself"'
      - "Agent B calls generateAgent → Agent C (A + GraphQL + Caching)"
    totalTime: "6-10 minutes for all rounds"
    result: "Specialization chain with full inheritance"

  example3:
    title: "Complete Workflow Suite Generation"
    description: "Build agents for entire data platform"
    steps:
      - 'User: "Generate agents for my data platform"'
      - "Round 1: DataIngestionAgent"
      - "Round 2: DataTransformationAgent"
      - "Round 3: DataStorageAgent"
      - "Round 4: DataQueryingAgent"
      - "Round 5: MonitoringAgent"
      - "All agents registered + auto-discoverable"
    totalTime: "15-25 minutes"
    result: "Complete integrated agent suite"

# ========================================
# METRICS & MONITORING
# ========================================

metrics:
  trackingItems:
    - "Agents generated per day"
    - "Average generation time per agent"
    - "Model usage distribution"
    - "Success rate of agent generations"
    - "Recursive generation depth (agent chains)"
    - "Agent reuse frequency"

  kdpis:
    - "Time from request to deployment: <5 min (best case)"
    - "Success rate: >90%"
    - "Agent composition success rate: >85%"
    - "User adoption rate of generated agents"

# ========================================
# VERSIONING & UPDATES
# ========================================

versioning:
  current: "1.0.0"
  updatePolicy: "Semantic versioning (MAJOR.MINOR.PATCH)"

  changeLog:
    - version: "1.0.0"
      date: "2026-03-05"
      changes:
        - "Initial release with GenerateAgents factory"
        - "Three core tools: generateAgent, analyzeCodebase, validateAgent"
        - "Three agent templates: web, api, data"
        - "Four composition patterns"
        - "GitHub Models integration"
        - "n8n workflow orchestration"

# ========================================
# TROUBLESHOOTING
# ========================================

troubleshooting:
  - issue: "Agent generation takes longer than expected"
    cause: "Repository too large or complex"
    solution: |
      - Use analyzeCodebase first to understand size
      - Run on subdirectory instead of full repo
      - Switch from gpt-4o to gpt-4o-mini for speed

  - issue: "Generated agent doesn't work correctly"
    cause: "Repository analysis missed key patterns"
    solution: |
      - Use validateAgent to identify issues
      - Provide more context in codebaseContext parameter
      - Switch to claude-3-5-sonnet (better prompt following)

  - issue: "Rate limit exceeded"
    cause: "Too many generations in short time"
    solution: |
      - Switch to gpt-4o-mini (150 calls/day)"
      - Space out requests over time
      - Batch similar generations together

  - issue: "Recursive generation not working"
    cause: "Generated agent missing generateAgent tool reference"
    solution: |
      - Check tool auto-registration completed
      - Validate agent manifest in collection
      - Ensure this collection.yml is loaded by awesome-copilot

